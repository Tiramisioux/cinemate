      - Audio recording: audio-recording.md
      - Digital zoom: digital-zoom.md
      - Speed ramping & shutter angle synchronization: speed-ramping.md
      - Storage pre-roll warm-up: storage-preroll.md
  - Configuring:
      - settings.jsonc: settings-json.md
      - Settings editor: settings-editor.md
      - Camera sensors and frame rates: sensors.md
      - ClearHDR (imx585): clear-hdr.md
      - CineMate Log (imx585 / imx283): cinemate-log.md
      - Dual sensors: dual-sensors.md
      - Additional hardware: hardware-controls.md
      - Building control units: building-control-units.md
      - Bookworm config.txt: config-txt.md
      - Configuring the Wi-Fi hotspot: hotspot-logic.md
  - System maintenance:
      - Connecting via SSH: ssh.md
      - System services: system-services.md
      - Recovery console: recovery-console.md
      - Backing up the SD card: backing-up-sd-card.md
  - Troubleshooting: troubleshooting.md
  - Advanced:
      - Audio sync & drift: audio-sync.md
      - Simple GUI refresh tuning: simple-gui-refresh-tuning.md
      - Manual installation: installation-steps.md
      - Compiling cinepi-raw: compiling-cinepi-raw.md
      # - Overclocking the Pi: overclocking.md   # shipped on by the installer; pending fact-check - hidden from the menu, page still builds
  - Reference:
      - Cinemate terminal commands: cli-commands.md
      - CinePi RAW terminal commands: cli-user-guide.md
      - Controller methods: controller-methods.md
      - Redis API: redis-guide.md
      - Redis Key reference: redis-keys.md
      - How Cinemate launches CinePi-raw: cinepi-multi.md
      - Changelog: changelog.md
  # - Cinemate builds:
  #     - Box build: brick.md
  - About:
      # - Todo: todo.md
      - Acknowledgements: acknowledgments.md
  #- Download PDF: renders/Cinemate-Docs.pdf
# Theme
# ───────────────────────────
theme:
  name: readthedocs
  custom_dir: docs/overrides
  icon:
    logo: material/library
  
  font:
    text: Roboto
    code: Roboto Mono

  language: en

extra_css:

  - stylesheets/extra.css
  # - overrides/github-markdown.css
  # - overrides/highlight.css
  # - overrides/markdown.css

  - https://unpkg.com/highlightjs-copy@1/dist/highlightjs-copy.min.css
extra_javascript:

  - https://unpkg.com/highlightjs-copy@1/dist/highlightjs-copy.min.js
  - js/ko-fi-widget.js
  - js/copybutton-init.js
                                         
# ───────────────────────────
# Markdown add-ons
# ───────────────────────────

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - codehilite:
      guess_lang: true
      use_pygments: true
      pygments_style: friendly
  - toc:
      permalink: "#"            # tiny link-icon on headings
  - pymdownx.snippets
  - pymdownx.superfences        # code blocks inside admonitions/tabs
  - pymdownx.tabbed
  - pymdownx.emoji
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

# ───────────────────────────
# Plugins
# ───────────────────────────
plugins:
  - search
 
