# DKMS packaging for the Pinefeat CEF168 lens driver, so cef168.ko is rebuilt
# for every kernel the system installs. Staged into /usr/src/cef168-<version>/
# by cinemate-install.sh together with the pinned upstream cef168.c and the
# Kbuild file beside this one (manual steps: docs/pinefeat.md).
#
# No MAKE or CLEAN lines on purpose: DKMS's generic command is
# `make -C <kernel build dir> M=<build dir>`, which reads Kbuild.
#
# PACKAGE_VERSION names this packaging, not the upstream commit. The installer
# records the upstream commit in a stamp file and rebuilds when it changes.
PACKAGE_NAME="cef168"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="cef168"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
