    ];

    // set_preview_source()'s cycle order. Only visible with two sensors.
    const PREVIEW_SOURCES = ['both', 'cam0', 'cam1', 'pip_cam0', 'pip_cam1'];

    // A range input fires on every pixel of a drag. The API's default ceiling
    // is 20 commands/sec per client (web_api_settings) and every accepted
    // line takes CommandExecutor's dispatch lock, so coalesce to one send per
    // interval and always deliver the value the drag actually ended on.
    function throttle(send, interval) {
        let pending = null;
        let timer = null;
        const flush = () => {
            if (pending === null) { timer = null; return; }
            const value = pending;
            pending = null;
            send(value);
            timer = setTimeout(flush, interval);
        };
        return (value) => {
            pending = value;
            if (timer === null) { flush(); }
        };
    }

    const xpSliders = [];
    const xpToggles = [];
    const xpConditionalGroups = [];
    let xpBuilt = false;

    function xpGroup(title, body) {
        const wrap = document.createElement('div');
        wrap.className = 'xp-group';
        const heading = document.createElement('div');
        heading.className = 'xp-title';
        heading.textContent = title;
        wrap.appendChild(heading);
        wrap.appendChild(body);
        return wrap;
    }

    function xpRow(className) {
        const row = document.createElement('div');
        row.className = className;
        return row;
    }

    // The live step table behind a step-list slider, or null for a continuous
    // one. Empty until the first push, which is why callers check the length.
    function sliderSteps(spec) {
        return spec.steps ? (steps[spec.steps] || []) : null;
    }

    function buildSlider(spec) {
        const row = xpRow('xp-slider');
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = spec.label;

        const input = document.createElement('input');
        input.type = 'range';
        if (!spec.steps) {
            input.min = spec.min;
            input.max = spec.max;
            input.step = spec.step;
        }
        input.setAttribute('aria-label', spec.label);
        input.title = spec.cmd;

        const out = document.createElement('span');
        out.className = 'value';

        const format = (v) => Number(v).toFixed(spec.dp || 0);
        const send = throttle((v) => cmd(spec.cmd + ' ' + v), spec.throttle || 150);

        // What the knob's current position means. For a step-list slider the
        // input holds an INDEX, not the value.
        const knobValue = () => {
            const list = sliderSteps(spec);
            if (!list) { return input.value; }
            return list.length ? list[Math.round(Number(input.value))] : null;
        };

        // Put the knob on `value` — nearest table entry for a step-list
        // slider, since the live value can sit off the grid (a pot, or a table
        // that was rebuilt under it).
        const placeKnob = (value) => {
            const list = sliderSteps(spec);
            if (!list) { input.value = value; return; }
            if (!list.length) { return; }
            let best = 0;
            let bestDistance = Infinity;
            list.forEach((candidate, i) => {
                const distance = Math.abs(Number(candidate) - Number(value));
                if (distance < bestDistance) { bestDistance = distance; best = i; }
            });
            input.value = best;
        };

        // Hold the knob where the user put it until the camera agrees.
        //
        // A plain "ignore state for N ms" guard is not enough: state pushes
        // ride the HDMI GUI's redraw loop, which measures nearer 7.5 Hz than
        // 12 and stalls outright under load, so any fixed window is sometimes
        // shorter than the round trip and the slider snaps back to the old
        // value a moment after release. Instead latch the requested value and
        // keep showing it until the pushed state matches it — then let go.
        //
        // PENDING_GRACE is the giving-up point, not the normal path: if the
        // value has not come back by then the write genuinely did not stick
        // (out of range for the mode, wrong sensor, a pot overriding it), and
        // showing the live value is the honest answer.
        const PENDING_GRACE = 4000;
        const entry = { spec, row, input, out, format, placeKnob, pending: null, pendingAt: 0 };

        // Latch what we asked for. `reposition` is false when the user's own
        // gesture already put the knob there — moving it again mid-drag would
        // fight the finger.
        const latch = (value, reposition) => {
            if (value === null || value === undefined) { return false; }
            if (reposition) { placeKnob(value); }
            entry.pending = format(value);
            entry.pendingAt = Date.now();
            out.textContent = entry.pending;
            return true;
        };

        // A setter that can block for seconds inside the request (set_fps
        // crossing a sensor mode) must not be handed a queue of drag values —
        // they would pile up behind the dispatch lock and come back as 503s.
        const busy = () => Boolean(spec.busyKey && truthy(V[spec.busyKey]));

        // `change` exists to guarantee the released value is sent even if the
        // throttle swallowed the last `input`. But throttle() fires on the
        // leading edge, so a plain click sends once from `input` and again
        // from `change` — two identical lines, two of the API's 20/sec slots,
        // and two entries behind a dispatch lock a slow setter can hold for
        // two seconds, the second of which comes back 503 "busy" for a command
        // that in fact applied. So `change` only speaks when it has something
        // new to say.
        input.addEventListener('input', () => {
            if (busy()) { return; }
            if (latch(knobValue(), false)) { entry.lastSent = entry.pending; send(entry.pending); }
        });
        input.addEventListener('change', () => {
            if (busy()) { return; }
            if (!latch(knobValue(), false)) { return; }
            if (entry.pending === entry.lastSent) { return; }
            entry.lastSent = entry.pending;
            cmd(spec.cmd + ' ' + entry.pending);
        });

        const reset = document.createElement('button');
        reset.className = 'xp-reset';
        reset.textContent = '↺';
        reset.setAttribute('aria-label', 'Reset ' + spec.label + ' to default');
        reset.addEventListener('click', () => {
            const fallback = steps.defaults[spec.key];
            if (fallback === undefined) { return; }
            // Route through the knob so a step-list slider sends the nearest
            // table entry rather than a default that may sit off the grid.
            placeKnob(fallback);
            if (!latch(knobValue(), false)) { return; }
            entry.lastSent = entry.pending;
            cmd(spec.cmd + ' ' + entry.pending);
        });
        entry.reset = reset;
        entry.grace = PENDING_GRACE;

        row.appendChild(label);
        row.appendChild(input);
        row.appendChild(out);
        row.appendChild(reset);
        xpSliders.push(entry);
        return row;
    }

    function buildToggle(spec) {
        const btn = document.createElement('button');
        btn.textContent = spec.label;
        btn.title = spec.cmd;
        btn.addEventListener('click', () => {
            if (spec.explicit) {
                cmd(spec.cmd + ' ' + (truthy(V[spec.key]) ? '0' : '1'));
            } else {
                cmd(spec.cmd);
            }
        });
        xpToggles.push({ spec, btn });
        return btn;
    }

    function buildExperiment() {
        const sliderGroups = XP_SLIDER_GROUPS.map((group) => {
            const rows = xpRow('xp-sliders');
            group.sliders.forEach((s) => rows.appendChild(buildSlider(s)));
            const wrap = xpGroup(group.title, rows);
            // Full-width row: see .xp-group.xp-wide -- slider track length is
            // the control's resolution. Set here rather than with :has(),
            // which needs Safari 15.4 and this page targets older iOS.
            wrap.classList.add('xp-wide');
            if (group.visibleKey) { xpConditionalGroups.push({ el: wrap, key: group.visibleKey }); }
            return wrap;
        });

        const modes = xpRow('xp-row');
        XP_TOGGLES.forEach((s) => modes.appendChild(buildToggle(s)));

        const free = xpRow('xp-row');
        XP_FREE.forEach((s) => free.appendChild(buildToggle(s)));

        const selects = xpRow('xp-row');

        const anaWrap = document.createElement('div');
        anaWrap.className = 'xp-select';
        const anaLabel = document.createElement('span');
        anaLabel.className = 'label';
        anaLabel.textContent = 'ANAMORPHIC';
        const anaSel = document.createElement('select');
        anaSel.id = 'xp-anamorphic';
        // set_anamorphic_factor() restarts cinepi-raw, unlike everything
        // else in this drawer. Say so rather than letting it look free.
        anaSel.title = 'set anamorphic factor — restarts the camera';
        anaSel.addEventListener('change', (e) => cmd('set anamorphic factor ' + e.target.value));
        const anaReset = document.createElement('button');
        anaReset.className = 'xp-reset';
        anaReset.id = 'xp-anamorphic-reset';
        anaReset.textContent = '↺';
        anaReset.setAttribute('aria-label', 'Reset anamorphic factor to default');
        anaReset.addEventListener('click', () => {
            const value = steps.defaults.anamorphic_factor_value;
            if (value !== undefined) { cmd('set anamorphic factor ' + value); }
        });
        anaWrap.appendChild(anaLabel);
        anaWrap.appendChild(anaSel);
        anaWrap.appendChild(anaReset);
        selects.appendChild(anaWrap);

        const srcWrap = document.createElement('div');
        srcWrap.className = 'xp-select';
        srcWrap.id = 'xp-preview-wrap';
        const srcLabel = document.createElement('span');
        srcLabel.className = 'label';
        srcLabel.textContent = 'HDMI PREVIEW';
        const srcSel = document.createElement('select');
        srcSel.id = 'xp-preview-source';
        srcSel.title = 'set preview — dual-sensor HDMI source';
        fillSelect(srcSel, PREVIEW_SOURCES.map((v) => ({ value: v, text: v.toUpperCase() })));
        srcSel.addEventListener('change', (e) => cmd('set preview ' + e.target.value));
        srcWrap.appendChild(srcLabel);
        srcWrap.appendChild(srcSel);
        selects.appendChild(srcWrap);

        const actions = xpRow('xp-row');
        XP_ACTIONS.forEach((spec) => {
            const btn = document.createElement('button');
            btn.textContent = spec.label;
            btn.title = spec.cmd;
            btn.addEventListener('click', () => cmd(spec.cmd));
            actions.appendChild(btn);
        });

        $('experiment').replaceChildren(
            ...sliderGroups,
            xpGroup('MODES', modes),
            xpGroup('FREE STEPPING', free),
            xpGroup('SELECT', selects),
            xpGroup('ACTIONS', actions)
        );
        xpBuilt = true;
    }

    // Mark the drawer while content sits below the fold, so CSS can fade the
    // last rows. Columns fit everything on a desktop, but not at 800x480 or a
    // landscape phone, and an overlay scrollbar says nothing.
    function noteExperimentOverflow() {
        const panel = $('experiment');
        panel.classList.toggle('more-below',
            panel.scrollHeight - panel.clientHeight - panel.scrollTop > 4);
    }

    function renderExperiment() {
        if (!xpBuilt || $('experiment').classList.contains('hidden')) { return; }
        const now = Date.now();

        // A whole group can be irrelevant to the attached sensor (ClearHDR on
        // an imx477). Hide the group, but keep rendering its rows — they cost
        // nothing and are correct the moment the group comes back.
        xpConditionalGroups.forEach(({ el, key }) => show(el, truthy(V[key])));

        xpSliders.forEach((entry) => {
            const spec = entry.spec;
            const list = sliderSteps(spec);

            if (list) {
                // Re-grid to the live table. It changes with the frame rate
                // (flicker-free angles), with the sensor mode (fps ceiling)
                // and with a free-stepping toggle.
                entry.input.min = 0;
                entry.input.max = Math.max(0, list.length - 1);
                entry.input.step = 1;
            } else {
                const bounds = spec.range && steps.ranges[spec.range];
                if (bounds) {
                    entry.input.min = bounds.min;
                    entry.input.max = bounds.max;
                    entry.input.step = bounds.step;
                }
                // Continuous, but with the travel bounded by a step table's
                // ends — which is exactly what a clamping setter enforces.
                const table = spec.boundsFrom && steps[spec.boundsFrom];
                if (table && table.length) {
                    entry.input.min = Math.min(...table);
                    entry.input.max = Math.max(...table);
                }
            }

            // A row can be unusable for three reasons, and every one of them
            // has to disable the input rather than just refuse the send:
            //
            //  locked  — the setter drops the write silently and answers 200.
            //  busy    — the parameter is mid-reconfigure (set_fps crossing a
            //            sensor mode). A drag here is not merely ignored: the
            //            state pushes keep arriving, so placeKnob() yanks the
            //            knob back under the finger and the value the gesture
            //            ended on is discarded with no indication why.
            //  no table — a step-list slider before its table has arrived.
            const locked = Boolean(spec.lockKey && truthy(V[spec.lockKey]));
            const switching = Boolean(spec.busyKey && truthy(V[spec.busyKey]));
            const unusable = locked || switching || (list !== null && list.length === 0);
            entry.input.disabled = unusable;
            entry.row.classList.toggle('disabled', unusable);
            entry.input.title = locked ? (spec.lockLabel || 'Locked')
                : switching ? 'Changing resolution…'
                : (list && !list.length) ? 'Waiting for the step table'
                : spec.cmd;

            const fallback = steps.defaults[spec.key];
            // Hide rather than grey out when there is nothing to restore. A
            // permanently disabled arrow reads as a broken control; several of
            // these parameters genuinely have no configured default.
            entry.reset.classList.toggle('absent', fallback === undefined);
            if (fallback !== undefined) {
                entry.reset.title = 'Reset to ' + entry.format(fallback);
            }

            const value = V[spec.key];
            if (value === undefined || value === null) { return; }
            const live = entry.format(value);

            let inFlight = false;
            if (entry.pending !== null) {
                // Camera caught up, or we have waited long enough to stop
                // pretending. Either way, stop latching.
                if (entry.pending === live || now - entry.pendingAt > entry.grace) {
                    entry.pending = null;
                } else {
                    inFlight = true;
                }
            }

            // Grey the arrow against what the row is SHOWING, not against the
            // live value — otherwise dragging away from the default leaves the
            // arrow disabled for the whole round trip, exactly when the user
            // is most likely to reach for it.
            // Compare as formatted text: the live value arrives as a float and
            // the default as whatever settings.jsonc holds, so 1 and 1.0 must
            // not read as "not yet default".
            // `unusable` is in here too: without it the arrow stays clickable
            // on a locked row, latches a value the setter drops, and shows it
            // as truth — with the arrow greyed as if the reset had worked —
            // for the full grace period. That is the exact freeze-then-jump
            // the lock branch above exists to prevent.
            const showing = inFlight ? entry.pending : live;
            entry.reset.disabled = unusable
                || fallback === undefined
                || entry.format(fallback) === showing;

            if (inFlight) { return; }   // leave the knob where the user put it

            entry.placeKnob(value);
            entry.out.textContent = live;
        });

        xpToggles.forEach(({ spec, btn }) => {
            if (spec.visibleKey) { show(btn, truthy(V[spec.visibleKey])); }
            btn.classList.toggle('on', truthy(V[spec.key]));
        });

        fillSelect($('xp-anamorphic'),
            steps.anamorphic.map((v) => ({ value: v, text: v + 'X' })),
            V.anamorphic_factor_value);
        const anaDefault = steps.defaults.anamorphic_factor_value;
        $('xp-anamorphic-reset').disabled = anaDefault === undefined
            || Number(anaDefault) === Number(V.anamorphic_factor_value);
        $('xp-anamorphic-reset').title = anaDefault === undefined
            ? 'No default configured' : 'Reset to ' + anaDefault + 'X';
        // Single-sensor rigs have no HDMI preview source to pick.
        show($('xp-preview-wrap'), Boolean(V.sensor_cam1));
        $('xp-preview-source').value = V.hdmi_preview_source || 'both';
    }

    function render() {
        document.body.style.backgroundColor = V.background_color || 'black';
        // color_mode = "inverse" for every non-idle background in draw_gui()
        document.body.classList.toggle('inverse',
            Boolean(V.background_color) && V.background_color !== 'black');
        renderTopRow();
        renderBottomRow();
        renderLeftRail();
        renderRightRail();
        renderVuMeter();
        updateRailRightVisibility();
        renderPreview();
        renderSelectors();
        renderExperiment();
        scheduleFit();
    }

    // ── W1+W2: shrink-to-fit rails ───────────────────────────────────────
    // Operator ruling (2026-09-01, binding): the rails stay left and right at
    // every viewport, including portrait phone. The layout never reflows or
    // restacks -- it shrinks. See the .rail rule above for the CSS half.
    //
    // Each rail may take at most 8.5% of the viewport width (W1). At 375 that
    // is 31.9px against a 38px natural box -> 0.839, landing --box-size just
    // above its 31px floor. Inert above 447px of viewport width
    // (447 * 0.085 == 38), so no laptop/desktop viewport is affected.
    const RAIL_WIDTH_SHARE = 0.085;

    let fitPending = false;
    function fitRails() {
        fitPending = false;
        ['rail-left', 'rail-right'].forEach((id) => {
            const el = $(id);
            if (!el || !el.isConnected || !el.clientHeight) { return; }
            el.classList.remove('fitted');
            el.style.setProperty('--fit', '1');          // measure at natural size
            const natural  = el.scrollHeight, avail = el.clientHeight;
            const naturalW = el.getBoundingClientRect().width;
            const fitH = Math.min(1, avail / natural);                                   // W2, height
            const fitW = Math.min(1, (window.innerWidth * RAIL_WIDTH_SHARE) / naturalW); // W1, width
            const fit  = Math.min(fitH, fitW);
            if (fit < 1) { el.classList.add('fitted'); }
            el.style.setProperty('--fit', fit.toFixed(4));
            // The max() floors in the .rail rule can stop the shrink short of
            // avail -- say so out loud via the fade fallback (CSS above).
            el.classList.toggle('clipped', el.scrollHeight - el.clientHeight > 1);
            updateRailFade(el);
        });
    }
    // A declaration, not a const arrow: sizePreview() calls this from well
    // above here, and a const would still be in its temporal dead zone at
    // that point -- a ReferenceError the first time the preview is sized.
    function scheduleFit() {
        if (!fitPending) { fitPending = true; requestAnimationFrame(fitRails); }
    }

    function updateRailFade(el) {
        el.classList.toggle('more-above', el.scrollTop > 0);
        el.classList.toggle('more-below', el.scrollTop + el.clientHeight < el.scrollHeight - 1);
    }
    ['rail-left', 'rail-right'].forEach((id) => {
        const el = $(id);
        if (el) { el.addEventListener('scroll', () => updateRailFade(el), { passive: true }); }
    });

    // Observe #stage, not the rails: writing --fit changes a rail's own
    // width, which would re-trigger a ResizeObserver on the rail itself.
    // #stage's border box is fixed by the grid and only its columns
    // redistribute, so this cannot loop. #stage's height also changes when
    // the EXPERIMENT drawer opens, with no window resize -- exactly the case
    // a media query cannot see.
    if (window.ResizeObserver) { new ResizeObserver(scheduleFit).observe($('stage')); }

    // ── push: server → browser only (module/app/main/events.py) ────────
    const socket = io();

    // Second, independent path to stream recovery, alongside `reload_stream`
    // (D1): a frozen MJPEG <img> fires neither `error` nor a naturalWidth
    // drop, so if the single reload_stream emit is missed (backgrounded tab,
    // socket hiccup during the restart), catching resolution_switching's
    // truthy->falsy edge here -- fed by the Redis fan-out, not the emit --
    // gives recovery a second chance. Seeded from initial_values so page
    // load itself is never mistaken for a falling edge.
    let prevResolutionSwitching = false;
    function noteResolutionSwitching() {
        const now = truthy(V.resolution_switching);
        if (prevResolutionSwitching && !now) { reloadStreams(); }
        prevResolutionSwitching = now;
    }

    // The four cycle-able step tables. populate_values() republishes each one
    // whenever it actually changes — a frame-rate change re-derives the
    // flicker-free angles, a sensor-mode change moves the fps ceiling, a
    // free-stepping toggle swaps a preset table for a continuous grid — and
    // the delta diff means an unchanged table costs nothing. Absorb them from
    // deltas too, or the selects and the step-list sliders go stale the moment
    // one is rebuilt and only recover on reconnect.
    const STEP_LISTS = {
        iso_steps: 'iso', shutter_a_steps: 'shutter_a',
        fps_steps: 'fps', wb_steps: 'wb',
    };

    function absorbSteps(data) {
        Object.keys(STEP_LISTS).forEach((field) => {
            if (Array.isArray(data[field])) { steps[STEP_LISTS[field]] = data[field]; }
        });
    }

    socket.on('initial_values', (data) => {
        V = Object.assign({}, data);
        absorbSteps(data);
        steps.resolutions = data.sensor_resolutions || [];
        prevResolutionSwitching = truthy(V.resolution_switching);
        const ranges = data.control_ranges || {};
        steps.anamorphic = ranges.anamorphic_steps || [];
        steps.ranges = { zoom: ranges.zoom };
        steps.defaults = ranges.defaults || {};
        render();
    });

    socket.on('gui_data_change', (data) => {
        Object.assign(V, data);
        absorbSteps(data);
        render();
    });

    socket.on('background_color_change', (data) => {
        V.background_color = data.background_color;
        render();
    });

    socket.on('parameter_change', (data) => {
        if (data.iso !== undefined) { V.iso = data.iso; }
        if (data.wb !== undefined) { V.wb = data.wb; }
        if (data.selected_resolution_mode !== undefined) {
            V.selected_resolution_mode = data.selected_resolution_mode;
        }
        if (data.resolution_switching !== undefined) {
            V.resolution_switching = data.resolution_switching;
            noteResolutionSwitching();
        }
        render();
    });

    socket.on('shutter_a_update', (data) => {
        steps.shutter_a = data.shutter_a_steps || steps.shutter_a;
        render();
    });

    socket.on('fps_update', (data) => {
        steps.fps = data.fps_steps || steps.fps;
        render();
    });

    socket.on('resolution_change', (data) => {
        if (data.sensor_mode !== undefined) { V.selected_resolution_mode = data.sensor_mode; }
        if (data.resolution_switching !== undefined) {
            V.resolution_switching = data.resolution_switching;
            noteResolutionSwitching();
        }
        render();
    });

    socket.on('reload_browser', () => window.location.reload());
    socket.on('reload_stream', () => reloadStreams());

    // A socket reconnect means cinemate (and with it cinepi-raw) went away
    // and came back — a settings-save restart, a crash — taking the MJPEG
    // connections with it. Reconnect the previews too.
    let socketWasConnected = false;
    socket.on('connect', () => {
        if (socketWasConnected) { reloadStreams(); }
        socketWasConnected = true;
    });

    // ── stream reload ─────────────────────────────────────────────────
    //    An MJPEG <img> dies for good the moment its connection drops —
    //    cinepi-raw relaunching for an aspect-ratio change, a settings-save
    //    restart, a crash — and a fixed number of retries loses the race
    //    against a full relaunch (the old 350/1200/2500 ms schedule is how
    //    the preview used to go black permanently). So: retry on every
    //    error until frames actually flow again. `load` fires on the first
    //    MJPEG frame; `error` re-arms the next attempt, so a dead server
    //    costs one request a second until it's back.
    function scheduleStreamReload(img, delay) {
        clearTimeout(img._reloadTimer);
        img._reloadTimer = setTimeout(() => {
            img._reloadTimer = null;
            if (img.classList.contains('hidden')) { return; }
            // NO query string. cinepi-raw's MJPEG server matches the raw
            // request-target against the one topic it publishes ("/stream"):
            // nadjieb mjpeg_streamer.hpp reads the target with
            // `getline(iss, target_, ' ')`, so the query is part of it, and
            // pathExists() is an exact map lookup -- "/stream?reload=1756..."
            // misses and the server answers 404 and closes. Every recovery
            // path here funnels through this function, so a cache-buster did
            // not just fail to help, it replaced a working MJPEG connection
            // with a permanent 404 (cinepi-raw deliberately keeps the listener
            // alive across a camera reconfigure, so the old connection would
            // have survived on its own).
            //
            // Dropping src first is what makes the browser re-request an
            // identical URL -- which is the reason the cache-buster was there.
            img.removeAttribute('src');
            // This connection has produced nothing yet, whatever the last one
            // managed. Without clearing the flag the watchdog below declines
            // to arm, and a reconnect that lands silent -- the camera still
            // coming up after a restart, which is exactly when reloadStreams()
            // runs -- has nothing watching it and stays black.
            img._gotFrame = false;
            img.src = img.dataset.streamBase;
            armStreamWatchdog(img);
        }, delay);
    }

    // A connection that is accepted and then silent produces no error event,
    // so the error handler below never runs and nothing retries.
    //
    // cinepi-raw registers /stream before the first frame exists, deliberately
    // (mjpegPreviewStage: "a client that connects early is accepted and simply
    // waits for the first real frame") so that a plain browser navigation
    // during boot does not land on a 404. That is right for a person typing
    // the address, and a trap for this <img>: it used to get the 404, fire
    // error, and recover through the retry above. Now it gets headers and
    // nothing, and stays blank until something else calls reloadStreams() --
    // which is why the preview came up black and only appeared once the
    // operator changed resolution.
    //
    // Armed whenever a src is set, and disarmed for good by the first frame.
    // Not re-armed on every load: whether a browser fires load per part of a
    // multipart/x-mixed-replace response is not something to bet a reconnect
    // loop on.
    const STREAM_FIRST_FRAME_MS = 4000;
    function armStreamWatchdog(img) {
        clearTimeout(img._watchTimer);
        if (img._gotFrame) { return; }
        img._watchTimer = setTimeout(() => {
            img._watchTimer = null;
            if (img._gotFrame || img.classList.contains('hidden')) { return; }
            if (!img.dataset.streamBase) { return; }
            scheduleStreamReload(img, 0);
        }, STREAM_FIRST_FRAME_MS);
    }
    function reloadStreams() {
        [$('stream'), $('stream-cam1')].forEach((img) => {
            if (!img || img.classList.contains('hidden')) { return; }
            scheduleStreamReload(img, 350);
        });
    }
    $('stream').dataset.streamBase = ($('stream').getAttribute('src') || '').split('?')[0];
    $('stream-cam1').dataset.streamBase = CAM1_STREAM;
    // The markup's own src is a connection nothing armed a watchdog for.
    armStreamWatchdog($('stream'));
    [$('stream'), $('stream-cam1')].forEach((img) => {
        img.addEventListener('error', () => {
            if (!img.dataset.streamBase || img.classList.contains('hidden')) { return; }
            scheduleStreamReload(img, 1000);
        });
        img.addEventListener('load', () => {
            img._gotFrame = true;
            clearTimeout(img._watchTimer);
            img._watchTimer = null;
            clearTimeout(img._reloadTimer);
            img._reloadTimer = null;
        });
    });
    // Watchdog for the case neither `error` nor `reload_stream` catches: a
    // listener that accepts the request but never delivers a frame. An
    // orphaned process squatting on :8000 does exactly that (see the
    // port-collision note in the docs) and the page would sit black forever
    // with no event ever firing. While the image is visible and has no
    // decoded frame, keep re-issuing the request.
    setInterval(() => {
        [$('stream'), $('stream-cam1')].forEach((img) => {
            if (!img || img.classList.contains('hidden') || !img.dataset.streamBase) { return; }
            if (img.naturalWidth === 0 && img._reloadTimer == null) { scheduleStreamReload(img, 0); }
        });
    }, 4000);

    // ── bindings ──────────────────────────────────────────────────────
    // A locked parameter's setter drops the write and still answers 200
    // (cinepi_controller.set_fps / set_iso), so the only feedback today is
    // _confirm_or_ok's generic "requested X, live value is Y" -- which never
    // says "locked". SHUTTER is worse: the top row sends `set shutter a`,
    // which never reads shutter_a_nom_lock, so the pill lies.
    const TOP_LOCKS = {
        's-iso':     { key: 'iso_lock',           label: LOCK_LABELS.iso_lock },
        's-shutter': { key: 'shutter_a_nom_lock', label: LOCK_LABELS.shutter_a_nom_lock },
        's-fps':     { key: 'fps_lock',           label: LOCK_LABELS.fps_lock },
    };
    function bindTopSelect(id, prefix) {
        $(id).addEventListener('change', (e) => {
            const guard = TOP_LOCKS[id];
            if (guard && truthy(V[guard.key])) {
                toast(guard.label);
                renderSelectors();
                return;
            }
            cmd(prefix + e.target.value);
        });
    }
    bindTopSelect('s-iso',     'set iso ');
    bindTopSelect('s-shutter', 'set shutter a ');
    bindTopSelect('s-fps',     'set fps ');
    bindTopSelect('s-wb',      'set wb ');
    bindTopSelect('s-res',     'set resolution ');

    // Tap-to-record, gated on the camera. The CAMERA NOT FOUND overlay sits
    // inside #preview-frame with pointer-events: none, so a tap anywhere on
    // that message would otherwise pass straight through to this handler and
    // fire `rec`. The controller refuses it either way (start_recording()
    // gates on the sensor mode table), but a tap that silently does nothing
    // is worse than one that was never sent -- this keeps the request off
    // the wire and out of the log.
    $('preview-frame').addEventListener('click', () => {
        if (V.camera_missing) { return; }
        cmd('rec');
    });
    $('btn-log').addEventListener('click', () => cmd('set log'));
    // Read at click time, not bound once: the state changes underneath this.
    $('btn-unmount').addEventListener('click', () => {
        cmd(truthy(V.is_mounted) ? 'unmount' : 'mount');
    });

    // Built on first open rather than at load: a camera that never opens the
    // drawer pays nothing for it, and renderExperiment() no-ops while it is
    // closed instead of touching ~30 widgets on every state push.
    function setExperimentOpen(open) {
        const panel = $('experiment');
        if (open && !xpBuilt) { buildExperiment(); }
        const app = $('app');
        if (app.classList.contains('xp-fill')) {
            const stage = $('stage');
            if (open) {
                // Measured before the drawer is shown, so this is the height
                // the picture has with it closed -- pin that, and the drawer
                // takes new space below rather than taking the picture's.
                const h = Math.round(stage.getBoundingClientRect().height);
                if (h > 0) { stage.style.height = h + 'px'; }
                app.classList.add('xp-open');
                document.documentElement.classList.add('xp-scroll');
            } else {
                app.classList.remove('xp-open');
                document.documentElement.classList.remove('xp-scroll');
                stage.style.height = '';
            }
        }
        panel.classList.toggle('hidden', !open);
        $('btn-experiment').classList.toggle('on', open);
        render();
        noteExperimentOverflow();
    }

    $('btn-experiment').addEventListener('click', () => {
        setExperimentOpen($('experiment').classList.contains('hidden'));
    });

    // The settings editor embeds this page in its Live view pane with ?xp=1,
    // where having every remaining control to hand is the point of the pane.
    // The bare page on :5000 is the shooting screen and stays closed -- the
    // drawer is ~30 widgets touched on every state push, which is exactly what
    // the build-on-first-open above exists to avoid paying for.
    if (new URLSearchParams(window.location.search).get('xp') === '1') {
        document.getElementById('app').classList.add('xp-fill');
        setExperimentOpen(true);
    }

    // The drawer changes the preview's available box without a window
    // resize, and so does an orientation change or a phone's URL bar
    // collapsing. Re-fit off the box itself rather than off the events that
    // happen to change it. sizePreview() only writes to #preview-frame, a
    // child, so this cannot feed itself.
    if (window.ResizeObserver) {
        new ResizeObserver(sizePreview).observe($('preview-wrap'));
        // Same reasoning for the drawer's own overflow flag: a rotate or a
        // group appearing/disappearing changes it with no window resize.
        // mask-image changes no layout, so this cannot feed itself.
        new ResizeObserver(noteExperimentOverflow).observe($('experiment'));
    }
    $('experiment').addEventListener('scroll', noteExperimentOverflow, { passive: true });

    // iPhone Safari exposes no element-fullscreen API at all; iPad does
    // (webkit-prefixed since iOS 12, unprefixed since 16.4). Probe the methods,
    // never the UA, so iPad keeps the button and a future iPhone gains it. The
    // preview is an MJPEG <img>, not a <video>, so there is no
    // HTMLVideoElement.webkitEnterFullscreen() fallback here. Calling a missing
    // method threw a TypeError inside the click listener that nothing caught --
    // and button:active still flashed, so the control looked like it worked.
    const fsBtn = $('btn-fullscreen');
    const fsRoot = document.documentElement;
    const fsRequest = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
    const fsExit = document.exitFullscreen || document.webkitExitFullscreen;
    const fsActive = () => document.fullscreenElement || document.webkitFullscreenElement;

    // iOS has no Fullscreen API on anything but a <video>, and this preview is
    // an MJPEG <img>, so the button cannot work there and is hidden rather
    // than left to throw. A "maximise" stand-in was tried and measured on a
    // 390px-wide phone: hiding the readouts and rails changed the picture not
    // at all -- 438x246 before and after -- because a 16:9 picture on a
    // portrait phone is limited by width, not height, and the rails give back
    // 31px a side out of ~490. A button that appears to do something and does
    // nothing is worse than no button, which is the reason this one hides.
    // Real screen on a phone comes from turning it landscape, or from Add to
    // Home Screen, which drops the browser chrome entirely.
    show(fsBtn, Boolean(fsRequest && fsExit));

    if (fsRequest && fsExit) {
        fsBtn.addEventListener('click', () => {
            // Both return a promise that rejects on an untrusted gesture or a
            // blocking permissions policy. webkitRequestFullscreen returns
            // undefined, hence the guard.
            const p = fsActive() ? fsExit.call(document) : fsRequest.call(fsRoot);
            if (p && p.catch) { p.catch((err) => toast('fullscreen → ' + err.message)); }
        });
        // Safari and iPadOS below 16.4 fire only the prefixed event and set only
        // document.webkitFullscreenElement, so one name and one property left
        // the label permanently stuck on 'FULLSCREEN' there.
        ['fullscreenchange', 'webkitfullscreenchange'].forEach((ev) => {
            document.addEventListener(ev, () => {
                fsBtn.textContent = fsActive() ? 'EXIT FULLSCREEN' : 'FULLSCREEN';
            });
        });
    }

    render();
}());
</script>
</body>
</html>
