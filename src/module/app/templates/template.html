<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CineMate</title>
    <style>
        /* ── simple_gui's type and palette ───────────────────────────────
           Same two faces the framebuffer GUI draws with (resources/fonts,
           copied into app/static), and the same colour constants, so the
           browser and the on-camera monitor read as one instrument. */
        @font-face {
            font-family: 'DIN2014';
            font-weight: 400;
            src: url("{{ url_for('static', filename='DIN2014-Regular.ttf') }}") format('truetype');
        }
        @font-face {
            font-family: 'DIN2014';
            font-weight: 700;
            src: url("{{ url_for('static', filename='DIN2014-Bold.ttf') }}") format('truetype');
        }

        /* Every token below except --box-text and --sync-tint (no Python
               counterpart -- see src/module/design_tokens.py's own docstring
               for why) is generated from src/module/design_tokens.py's
               DESIGN_TOKENS dict, name-for-name (underscores -> hyphens).
               tools/design_token_diff.py --strict fails if this block drifts
               from that source. */
        :root {
            --label: rgb(136, 136, 136);
            --box: rgb(136, 136, 136);
            --value: rgb(249, 249, 249);
            --guide: rgb(249, 249, 249);
            --box-text: #000;
            --zoom-hi: rgb(255, 221, 0);
            --drop: rgb(120, 40, 180);
            --drop-text: rgb(255, 255, 255);
            --sync: rgb(255, 0, 255);
            --no-cam: rgb(220, 30, 30);
            --log-badge: rgb(205, 205, 205);
            --hdr-badge: rgb(205, 205, 205);
            --sdr-badge: rgb(120, 120, 120);
            --wav-rec: rgb(210, 210, 210);
            --res-switching: rgb(176, 176, 176);
            --sync-tint: lightgreen;
            --lock: rgb(255, 0, 0);
            --voltage: rgb(218, 149, 77);

            --gap: clamp(8px, 1.4vw, 22px);
            --value-size: clamp(1.05rem, 2.05vw, 1.9rem);
            --label-size: clamp(0.72rem, 1.45vw, 1.35rem);
            --box-size: clamp(38px, 3.6vw, 60px);
            --box-height: clamp(28px, 2.5vw, 40px);

            /* W1+W2: the rail re-derives these four from *-base * --fit
               (see .rail below and fitRails()). The names above stay the
               laptop-authored minimums tools/design_token_diff.py reads. */
            --gap-base:        clamp(8px, 1.4vw, 22px);
            --label-size-base: clamp(0.72rem, 1.45vw, 1.35rem);
            --box-size-base:   clamp(38px, 3.6vw, 60px);
            --box-height-base: clamp(28px, 2.5vw, 40px);
        }

        /* draw_gui() switches every label and value to black once the
           background leaves "black" (color_mode = "inverse"). */
        /* The preview guide keeps its own colour in every mode — draw_gui()
           picks it from zoom state, not from color_mode. */
        body.inverse {
            --label: #000;
            --value: #000;
            --sync-tint: #000;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;   /* fallback for anything without dvh */
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'DIN2014', 'Arial Narrow', Arial, sans-serif;
            background-color: {{ background_color or 'black' }};
            color: var(--value);
            -webkit-text-size-adjust: 100%;
            transition: background-color 90ms linear;
        }

        /* Safari and Chrome on a phone resolve 100% against the LARGE viewport
           -- the one that exists when the toolbar is retracted -- so the foot
           of a non-scrolling page sits behind the toolbar. With overflow
           hidden there is no way to scroll it into view either, which is why
           the button row, and FULLSCREEN with it, was simply unreachable on a
           phone while emulation showed it on screen: emulation has no
           toolbar. dvh is the visible viewport, toolbar included. */
        @supports (height: 100dvh) {
            html, body { height: 100dvh; }
        }

        #app {
            height: 100%;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: calc(var(--gap) * 0.6) var(--gap);
            gap: calc(var(--gap) * 0.5);
        }

        /* ── top info row ────────────────────────────────────────────────
           simple_gui justifies six label+value groups between
           TOP_ROW_LEFT_X and RES_RIGHT_ANCHOR; space-between is the same
           idea, and it wraps on a phone instead of overflowing. */
        #top-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            /* Row gap must be at least twice .group select's 8px vertical
               bleed, or the two wrapped rows' invisible hit areas meet in
               the middle and the lower row's picker wins the upper row's
               bottom 4px. Inert whenever the row does not wrap, so it costs
               nothing at any width the HDMI GUI has a counterpart for. */
            gap: max(16px, calc(var(--gap) * 0.5)) var(--gap);
        }

        .group {
            position: relative;
            display: flex;
            align-items: baseline;
            gap: 0.35em;
            white-space: nowrap;
        }
        .group .label {
            font-weight: 400;
            font-size: var(--label-size);
            color: var(--label);
        }
        .group .value {
            font-weight: 700;
            font-size: var(--value-size);
            color: var(--value);
            line-height: 1.05;
        }
        .group.tinted .value { color: var(--sync-tint); }
        .group.switching .value { color: var(--res-switching); }

        /* draw_rounded_box(): a locked parameter is drawn inverted. */
        .group.locked .value {
            background: #fff;
            color: #000;
            border-radius: 5px;
            padding: 0 0.22em;
        }

        /* A transparent native select over the group keeps the platform
           picker on touch devices while the styled text stays visible.
           The negative inset stretches the hit area past the group box —
           the text is only ~18px tall on a phone, far under the ~44px
           touch-target guideline. px, not em: em here would resolve
           against the UA's hidden control font (13-16px depending on
           engine), not the visible text. Invisible, so the cost is that
           where the top row wraps on a portrait phone, the lower row's
           select wins a 4px strip of the row above — DOM order breaks the
           tie between two position:absolute, z-index:auto siblings — which
           cancels this rule's own tap-target gain for the two affected
           groups. #top-row's row gap (below) is what prevents it; the two
           rules are coupled. That 4px band is line-box leading, not
           descender ink — it contains no glyph. */
        .group select {
            position: absolute;
            inset: -8px -6px;
            opacity: 0;
            border: 0;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }
        .group.selectable { cursor: pointer; }

        .badge {
            display: inline-block;
            align-self: center;
            font-weight: 700;
            font-size: calc(var(--value-size) * 0.58);
            line-height: 1;
            color: #000;
            border-radius: 3px;
            padding: 0.28em 0.45em;
        }
        .badge.hdr { background: var(--hdr-badge); }
        .badge.sdr { background: var(--sdr-badge); }
        /* simple_gui draws the WAV pill at 14px against clip_name's 18px
           (~0.78x) -- smaller than clip_name itself, not the generic 0.58
           top-row badge ratio, which was sized against the full-height RES
           value instead. The px floor is browser-only: the HDMI ratio
           lands below legibility once the clamp()ed web sizes shrink
           (~4.9px on a phone in landscape). */
        .badge.wav {
            background: var(--box);
            font-size: max(8px, calc(var(--value-size) * 0.34));
        }
        .badge.wav.recording { background: var(--wav-rec); }
        .badge.hidden { display: none; }

        /* ── stage: left rail · preview · right rail ─────────────────── */
        #stage {
            min-height: 0;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: stretch;
            gap: var(--gap);
        }

        /* Unlike simple_gui's fixed 1920x1080 canvas, the rail's content
           height is not bounded — two sensors plus every warning/lock box
           can outgrow the stage row on a short viewport. Scroll rather
           than clip, so a real status (e.g. the storage filesystem badge)
           never silently disappears. */
        .rail {
            display: flex;
            flex-direction: column;
            gap: calc(var(--gap) * 0.5);
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            /* W1+W2: --fit is written by fitRails() and is the smaller of the
               height ratio (rail content vs stage row) and the width ratio
               (rail budget vs viewport). The max() floors are the legibility
               floor; when one binds, fitRails sets .clipped and the fade
               fallback (below) shows. Operator ruling: rails stay left and
               right at every viewport and shrink, never restack -- this is
               the shrink. */
            --gap:         max(var(--floor-gap,   6px),  calc(var(--gap-base)        * var(--fit, 1)));
            --label-size:  max(var(--floor-label, 11px), calc(var(--label-size-base) * var(--fit, 1)));
            --box-size:    max(var(--floor-box,   31px), calc(var(--box-size-base)   * var(--fit, 1)));
            --box-height:  max(var(--floor-height,23px), calc(var(--box-height-base) * var(--fit, 1)));
            /* draw_left_sections() starts its CAM column at y=97 on the
               1080p canvas — roughly a box-height of air below the top row.
               Reproduce that offset so the rails sit like the HDMI GUI's
               instead of hugging the top bar. --rail-pad shrinks this dead
               band once the rail is actually being fitted. */
            padding-top: calc(var(--box-height) * var(--rail-pad, 1.3));
            overscroll-behavior: contain;   /* matches #experiment; the rails were missed */
        }
        .rail.fitted { --rail-pad: 0.4; }   /* reclaim the dead band once we are shrinking */

        /* Upright on a phone the rails are as tall as the picture and sit
           beside it, the proportion simple_gui draws on the HDMI overlay --
           60x40 boxes flanking the image on a 1920x1080 canvas, not flanking
           the empty space around it.
           --preview-h is written by sizePreview(); the fallback keeps the
           stretched behaviour if it has not run yet. fitRails() then measures
           against this height instead of the row's, so the boxes scale to the
           picture the way they do at 1080p. */
        @media (orientation: portrait) and (max-width: 900px) {
            /* align-self on the rails, NOT align-items on #stage: that stops
               the preview column stretching too, so #preview-wrap collapses
               to whatever --preview-h last said and sizePreview() then
               letterboxes into that smaller box -- measured at 390x844, a
               585px row with the picture settling at 237px and shrinking. */
            #rail-left, #rail-right { align-self: center; height: var(--preview-h, 100%); }
            /* The row is much taller than a 16:9 picture on a portrait phone,
               so the buttons under it have room to be worth tapping. 23px was
               the height they inherited from the desk layout. */
            #button-row button, #button-row .btn-link { min-height: 40px; padding-inline: 1em; }
        }
        /* Fallback only, once the legibility floor above stops the shrink
           short of the rail's available height (fitRails sets .clipped).
           A mask paints in the element's own border box and does not scroll
           away with the content, unlike a ::after pseudo-element would. */
        .rail.clipped.more-below {
            -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
                    mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
        }
        .rail.clipped.more-above {
            -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14px);
                    mask-image: linear-gradient(to bottom, transparent, #000 14px);
        }
        .rail.clipped.more-above.more-below {
            -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14px, #000 calc(100% - 26px), transparent);
                    mask-image: linear-gradient(to bottom, transparent, #000 14px, #000 calc(100% - 26px), transparent);
        }
        .rail:empty { display: none; }

        /* W1: narrow width only, claws back the fixed chrome around the
           rails. The rails themselves shrink through --fit (fitRails, in the
           script below), never through this block. Width-keyed, so 812x375
           landscape does NOT match -- unlike the @media below (:orientation),
           which fires on landscape phones. No .rail declaration belongs here:
           that would be a second, equal-specificity geometry mechanism. */
        @media (max-width: 540px) {
            #stage { gap: 6px; }
            #app   { padding-left: 4px; padding-right: 4px; }
        }

        .section { display: flex; flex-direction: column; align-items: center; }
        .section + .section { margin-top: calc(var(--gap) * 0.7); }
        .section .section-label {
            font-weight: 400;
            font-size: var(--label-size);
            color: var(--value);
            margin-bottom: 0.1em;
        }
        .section .boxes {
            display: flex;
            flex-direction: column;
            gap: calc(var(--gap) * 0.35);
        }

        .box {
            width: var(--box-size);
            height: var(--box-height);
            background: var(--box);
            color: var(--box-text);
            font-weight: 700;
            font-size: calc(var(--box-height) * 0.62);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        /* aspect and anamorphic get the inset outline simple_gui draws */
        .box.outlined { box-shadow: inset 0 0 0 2px #000; }
        .box.small { font-size: calc(var(--box-height) * 0.48); }
        /* A warning box may carry a count ("DROP 17"). simple_gui's box is a fixed
           60x40 and shrinks the font instead (simple_gui.py:1290-1293); the browser
           has room. Grow on the inline axis only, from the same --box-size floor,
           so every box that already fits keeps the rail's pitch. */
        .box.wide {
            width: auto;
            min-width: var(--box-size);
            padding-inline: calc(var(--box-height) * 0.18);
            white-space: nowrap;
        }
        .box.zoom-active { background: var(--zoom-hi); }
        .box.log { background: var(--log-badge); }
        .box.drop { background: var(--drop); color: var(--drop-text); }
        .box.sync { background: var(--sync); position: relative; }
        /* _draw_status_box(crossed=True) strikes the SYNC box through */
        .box.sync::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: linear-gradient(to bottom right,
                transparent calc(50% - 1.5px), #000 calc(50% - 1.5px),
                #000 calc(50% + 1.5px), transparent calc(50% + 1.5px));
        }

        /* ── mic input VU meter (draw_right_vu_meter) ──────────────────
           Bars are built once per channel-count change and updated in
           place afterward (height/colour/peak only) so the CSS transition
           actually animates instead of snapping on every ~83ms push. Sits
           at the bottom of the right rail via margin-top:auto, the same
           bottom-right corner simple_gui anchors it to. */
        #vu-meter {
            display: flex;
            align-items: flex-end;
            gap: clamp(4px, 0.5vw, 8px);
            margin-top: auto;
            padding-top: calc(var(--gap) * 0.6);
        }
        #vu-meter.hidden { display: none; }
        .vu-channel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .vu-track {
            position: relative;
            width: clamp(8px, 0.6vw, 14px);
            height: clamp(70px, 16vh, 180px);
            background: rgb(50, 50, 50);
            overflow: hidden;
        }
        .vu-fill {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 0%;
            background: rgb(0, 200, 0);
            transition: height 90ms linear, background-color 90ms linear;
        }
        .vu-peak {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0%;
            height: 2px;
            background: #fff;
            transition: bottom 90ms linear;
        }
        .vu-channel .label {
            font-weight: 400;
            font-size: var(--label-size);
            color: var(--label);
        }

        #preview-wrap {
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* The guide box is drawn on the frame, not the <img>, so the border
           hugs the picture instead of the letterbox — the browser analogue
           of _calculate_preview_guide_rect(). sizePreview() sets the pixel
           size from the live aspect; CSS alone cannot fit a ratio inside
           both a max width and a max height without breaking one of them. */
        #preview-frame {
            position: relative;
            border: 2px solid var(--guide);
            background: #000;
            cursor: pointer;
            display: flex;
        }
        #preview-frame.dual { gap: 2px; }
        #preview-frame img {
            flex: 1 1 0;
            min-width: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }
        #preview-frame img.hidden { display: none; }

        /* No live stream to sit on top of while no camera is detected --
           the preview area is otherwise just black. Mirrors simple_gui's
           _draw_no_camera_message() in the same empty space. */
        #no-cam-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.4em;
            text-align: center;
            padding: 1em;
            background: rgba(0, 0, 0, 0.55);
            pointer-events: none;
        }
        #no-cam-overlay.hidden { display: none; }
        #no-cam-overlay .line { line-height: 1.3; }
        #no-cam-overlay .title {
            color: var(--value);
            font-weight: 700;
            font-size: clamp(1rem, 2.6vw, 1.8rem);
        }
        #no-cam-overlay .warn {
            color: var(--no-cam);
            font-weight: 700;
            font-size: clamp(0.8rem, 1.8vw, 1.2rem);
        }
        #no-cam-overlay .hint {
            color: var(--label);
            font-size: clamp(0.7rem, 1.4vw, 1rem);
        }

        /* ── bottom row ──────────────────────────────────────────────── */
        /* Same field order as simple_gui's bottom row, but a size down so
           MEDIA … RAM and the action buttons stay on one line on a laptop. */
        #bottom-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: calc(var(--gap) * 0.4) calc(var(--gap) * 0.8);
            --value-size: clamp(0.9rem, 1.5vw, 1.4rem);
            --label-size: clamp(0.65rem, 1.05vw, 1rem);
        }
        #bottom-row .spacer { flex: 1 1 auto; }
        /* simple_gui's layout dict draws clip_name at size 18 against 41 for
           its neighbours (disk_space, cpu_load, …) — ~0.44 of them, not a
           font a browser would pick on its own. Match that ratio, and give
           it enough room for the full "CINEPI_25-07-01_220547_F10_C00000_
           000000009" string simple_gui actually shows (uncut — the DNG
           basename minus the _camN suffix, frame counter included) rather
           than an arbitrary width that ellipsizes it early. The px floor
           is browser-only: 0.44 of the clamp()ed web size bottoms out at
           ~6.3px on a phone in landscape, under any legible size. */
        .group.clip .value {
            font-size: max(10px, calc(var(--value-size) * 0.44));
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70vw;
        }
        .clip-lines { display: flex; flex-direction: column; gap: 0.1em; }
        .warn { font-weight: 700; font-size: var(--value-size); }
        .warn.lock { color: var(--lock); }
        .warn.voltage { color: var(--voltage); }

        #buffer-meter {
            width: clamp(46px, 6vw, 96px);
            height: calc(var(--value-size) * 0.42);
            background: rgba(136, 136, 136, 0.35);
            box-shadow: inset 0 0 0 1px var(--label);
        }
        #buffer-fill { height: 100%; width: 0%; background: var(--label); }

        #bottom {
            display: flex;
            flex-direction: column;
            gap: calc(var(--gap) * 0.45);
        }
        /* The cog is an <a>; give it the row's button shape so it does not
           read as a stray link among buttons. */
        #button-row .btn-link {
            display: inline-flex; align-items: center; justify-content: center;
            text-decoration: none;
        }
        #button-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: calc(var(--gap) * 0.5);
            padding-top: calc(var(--gap) * 0.45);
            border-top: 1px dashed var(--label);
        }

        button, #button-row .btn-link {
            font-family: inherit;
            font-weight: 700;
            font-size: calc(var(--value-size) * 0.62);
            color: var(--value);
            background: transparent;
            border: 2px solid var(--label);
            border-radius: 4px;
            padding: 0.3em 0.7em;
            cursor: pointer;
            white-space: nowrap;
        }
        button:active, #button-row .btn-link:active { background: var(--label); color: #000; }
        button.on { background: var(--log-badge); border-color: var(--log-badge); color: #000; }
        button[disabled] { opacity: 0.45; cursor: default; }

        /* ── EXPERIMENT drawer ────────────────────────────────────────────
           Every control cli_commands.py exposes that the instrument layout
           above deliberately does not — the ClearHDR knobs, the locks, the
           free-stepping modes. Collapsed by default so the page still reads
           as a camera.

           The height cap plus its own scrollbar is what keeps the picture
           pinned: #stage is the only 1fr row in #app and the page itself
           never scrolls, so opening this panel shrinks the preview rather
           than pushing it off the top. Whatever the drawer doesn't take,
           the preview keeps.

           Opening it deliberately does NOT reflow anything. #top-row stays
           pixel-identical, the rails keep their column direction and their
           x/width, and no element changes order or flow. The only thing that
           moves is the height of the 1fr row — the preview scales down inside
           it and the bottom rows ride up with it. If you are tempted to
           restack the rails when the drawer opens: don't. A layout that
           rearranges itself under the operator mid-shot is worse than a
           smaller picture. The one restack in this file is the width-driven
           media query at the end, which is a different screen, not a
           different mode of the same screen. */
        /* Embedded in the settings editor's Live view pane (?xp=1), where the
           drawer is the point of the pane rather than something opened over a
           shot, so it is given a much taller cap than the shooting screen's.

           The cap has to stay a definite length. Handing the drawer a flexible
           row and letting it size itself does not work: a grid item's
           automatic minimum is its content, so the row grows to the full
           height of the controls, #stage is squeezed to 0 -- the preview
           vanishes outright -- and overflow-y never engages because the box is
           already as tall as its content. min-height:0 alone does not save it.
           Measured on the camera: rows-and-fr gave stage 0px and 125px of
           overflow, this gives stage 170px, drawer 527px and a drawer that
           actually scrolls.

           #stage keeps a floor for the same reason -- whatever else happens,
           the picture does not disappear. */
        /* The rails carry legibility floors -- max(31px, ...) and friends --
           so fitRails() cannot always shrink them into the height it has. On
           the shooting screen that is the right trade: the operator ruling is
           that the rails stay readable and the layout never restacks. In this
           pane, with the drawer taking a share of a browser window that may
           be short, those floors stop the shrink early and the bottom of the
           left rail is simply cut off -- the operator loses the SYS section
           rather than reading it smaller.
           Measured on the camera at 1800x700, drawer open: as shipped the
           left rail needed 343px in a 240px column; at these floors it needs
           240 and fits. Lower floors than this gain nothing -- the shrink is
           no longer what limits it. */
        /* Lower floors where the alternative is losing content rather than
           reading it smaller. Applied by height, not by which page this is:
           the same squeeze happens on a phone, in a short browser window, and
           in the settings editor's Live view pane, and the operator asked for
           all three to work.
           A media query rather than reacting to fitRails' .clipped flag,
           which would oscillate: lowering the floor un-clips the rail, which
           would restore the floor, which clips it again. */
        @media (max-height: 820px) {
            .rail { --floor-gap: 2px; --floor-label: 8px; --floor-box: 18px; --floor-height: 13px; }
        }
        /* The embedded pane is short whatever the window does -- the drawer
           always takes a share -- so it takes the lower floors outright. */
        #app.xp-fill .rail { --floor-gap: 2px; --floor-label: 8px; --floor-box: 18px; --floor-height: 13px; }

        /* Opening the drawer in this pane must not cost the picture any size.
           The shooting screen deliberately trades the other way -- there the
           page never scrolls and the drawer eats into the preview, because a
           layout that grows under the operator mid-shot is worse than a
           smaller picture. This pane is a desk tool, so it grows instead: the
           stage is pinned to the height it had with the drawer closed, the
           drawer runs to its full natural height, and the pane scrolls. */
        #app.xp-fill.xp-open { height: auto; min-height: 100%; }
        #app.xp-fill.xp-open #experiment { max-height: none; overflow-y: visible; }
        html.xp-scroll, html.xp-scroll body { overflow: auto; height: auto; min-height: 100%; }
        #app.xp-fill { grid-template-rows: auto minmax(240px, 1fr) auto auto; }
        #app.xp-fill #experiment {
            /* The picture comes first. An earlier cap let the drawer take
               whatever it wanted, which pinned #stage at its floor and left a
               302x170 preview inside a 1266px-wide pane -- and dragged the
               rails down with it, since fitRails() sizes them off the stage's
               height and their max() floors stop the shrink short, so the
               badges stayed large beside a tiny picture. Measured on the
               camera at 1400x900: this cap gives a 791x442 preview against
               298x166 before, with the drawer still 240px and scrolling. */
            max-height: min(28vh, 260px);
            min-height: 0;
        }

        #experiment {
            max-height: min(46vh, 460px);
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            /* Columns, not one stack. The drawer's groups were laid out full
               width at every size, so on a 1440px screen seven groups of
               ~60px stacked into 570px of content inside a 367px box and a
               third of the panel was unreachable. auto-fit uses the width
               that was already there instead of taking height from the
               preview: measured at 1440x800, content 570 -> 514, and the
               groups that carry sliders keep the full width below. Below
               ~340px + gap it resolves to one column, i.e. exactly today's
               layout on a phone. */
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            align-content: start;
            gap: calc(var(--gap) * 0.55);
            /* The fixed right padding is for the panel's own scrollbar. An
               overlay scrollbar (macOS, iOS, Android) reserves no width and
               scrollbar-gutter does not apply to one, so without a gutter of
               our own the last column's value renders underneath it. */
            padding: calc(var(--gap) * 0.5) 14px 0 0;
            border-top: 1px dashed var(--label);
            --value-size: clamp(0.85rem, 1.3vw, 1.15rem);
            --label-size: clamp(0.6rem, 1vw, 0.9rem);
        }

        .xp-group { display: flex; flex-direction: column; gap: calc(var(--gap) * 0.3); }
        /* A slider group always spans the whole row. The rule below ("track
           length IS the resolution of the control") is the reason: letting a
           0-4095 threshold fall into a 340px column would put ~19 counts on
           every pixel. Measured at 1440x800: 1148px of track either way. */
        .xp-group.xp-wide { grid-column: 1 / -1; }
        .xp-title {
            font-weight: 700;
            font-size: var(--label-size);
            letter-spacing: 0.09em;
            color: var(--label);
        }

        /* One slider per row, full panel width, at every size. A multi-column
           grid fits more rows on screen but makes each track a few hundred
           pixels wide — and track length IS the resolution of the control. A
           0–4095 HDR threshold across 240px is ~17 counts per pixel; across
           the full width it is a quarter of that. These are fine-adjustment
           knobs, so the width is the feature. */
        .xp-sliders {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: calc(var(--gap) * 0.2);
        }
        /* Overlay scrollbars (macOS, iOS, Android) reserve no width and paint
           nothing until a scroll is already under way, so a clipped drawer
           reads as a finished one. Columns close the gap on a desktop but not
           at 800x480 or a landscape phone; fade the last rows there so the
           remainder is visible as missing. */
        #experiment.more-below {
            -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 2.2em), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 2.2em), transparent);
        }
        .xp-slider { display: flex; align-items: center; gap: 0.55em; }
        .xp-slider .label {
            font-size: var(--label-size);
            color: var(--label);
            flex: 0 0 7em;
            white-space: nowrap;
        }
        .xp-slider input[type="range"] {
            flex: 1 1 auto;
            min-width: 0;
            height: 1.7em;
            accent-color: var(--value);
        }
        /* Locked parameter, or a step table that has not arrived yet. Dim the
           whole row so the reason reads as "this control is unavailable"
           rather than "this slider is broken"; the input's title says which. */
        /* pointer-events, not just opacity: a disabled <input> ignores clicks
           but the reset button beside it does not, and a live arrow on a row
           the UI is showing as unavailable is worse than no arrow. */
        .xp-slider.disabled { opacity: 0.4; pointer-events: none; }
        .xp-slider.disabled input[type="range"] { cursor: not-allowed; }
        .xp-slider .value {
            font-weight: 700;
            font-size: var(--value-size);
            color: var(--value);
            flex: 0 0 3.4em;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Reset-to-default arrow. Borderless so a row of them doesn't read as
           a row of buttons competing with the MODES toggles below, but sized
           to the 44px touch target a phone needs. */
        .xp-reset {
            flex: 0 0 auto;
            border: 0;
            background: transparent;
            color: var(--label);
            font-size: calc(var(--value-size) * 1.15);
            line-height: 1;
            padding: 0;
            width: 1.9em;
            height: 1.9em;
            min-width: 44px;
            min-height: 32px;
            cursor: pointer;
        }
        .xp-reset:hover { color: var(--value); }
        .xp-reset:active { background: transparent; color: var(--value); }
        /* Nothing to restore — the value is already the default. */
        .xp-reset[disabled] { opacity: 0.25; cursor: default; }
        /* No default is configured for this parameter at all. Hide it but keep
           its box, so the value column stays aligned down the panel — display:
           none would let those rows' tracks run longer than the others'. */
        .xp-reset.absent { visibility: hidden; pointer-events: none; }

        .xp-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: calc(var(--gap) * 0.35);
        }
        .xp-row button {
            font-size: var(--value-size);
            border-width: 1px;
            padding: 0.28em 0.6em;
        }

        .xp-select { display: flex; align-items: center; gap: 0.45em; }
        .xp-select .label { font-size: var(--label-size); color: var(--label); }
        .xp-select select {
            font-family: inherit;
            font-weight: 700;
            font-size: var(--value-size);
            color: var(--value);
            background: transparent;
            border: 1px solid var(--label);
            border-radius: 4px;
            padding: 0.28em 0.4em;
        }
        /* A native picker draws its list on a system-coloured sheet, not on
           our black page — leave the options readable there. */
        .xp-select select option { color: #000; background: #fff; }

        .hidden { display: none !important; }

        /* Toast for a rejected command — the API answers "err <reason>"
           and silently dropping that would be worse than a brief banner. */
        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(var(--gap) * 2);
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            border: 1px solid var(--label);
            border-radius: 4px;
            padding: 0.5em 0.9em;
            font-size: 0.95rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 140ms linear;
            z-index: 20;
        }
        #toast.show { opacity: 1; }

        /* ── narrow screens: scale, don't reflow (B11.7 / F-297) ──────────
           This used to restack #stage into rows and turn each .rail into a
           horizontal strip above/below the preview at <=900px or portrait
           -- the one thing that made the web GUI stop resembling the HDMI
           GUI at narrow widths. simple_gui.py never restacks either, but it
           does not scale its whole layout by one ratio: only the top row,
           layout-dict positions, the HDR badge and the clip name scale by
           disp_width/1920 / disp_height/1080 -- draw_left_sections() and
           draw_right_sections() draw the rail boxes at a fixed BOX_H/BOX_W
           with no shrink factor at all. #stage's 3-column grid (left rail | preview |
           right rail) and .rail's own column direction are the same at
           every width now -- --gap/--box-size/--box-height/--value-size/
           --label-size are already clamp()-based (top of this file), so
           the rails and top-row text shrink smoothly as the viewport
           narrows instead of the layout restructuring at a breakpoint.
           minmax(0, 1fr) on #stage's center column absorbs whatever's left
           for the preview once both rails have taken their (now small)
           clamped width. Only genuinely orientation-neutral narrow-screen
           tweaks remain here. */
        @media (max-width: 900px), (orientation: portrait) {
            #button-row { justify-content: center; }
            .vu-track { height: clamp(50px, 12vh, 100px); }
            /* Leave the preview more than half the screen on a phone — the
               drawer exists to watch the picture change, not to replace it. */
            #experiment { max-height: 40vh; }
            .xp-slider .label { flex: 0 0 6em; }
        }
    </style>
</head>
<body>
<div id="app">

    <div id="top-row">
        <div class="group selectable" id="g-fps">
            <span class="label" id="l-fps"></span><span class="value" id="v-fps"></span>
            <select id="s-fps" aria-label="Frame rate"></select>
        </div>
        <div class="group selectable" id="g-shutter">
            <span class="label" id="l-shutter"></span><span class="value" id="v-shutter"></span>
            <select id="s-shutter" aria-label="Shutter angle"></select>
        </div>
        <div class="group" id="g-exp">
            <span class="label" id="l-exp"></span><span class="value" id="v-exp"></span>
        </div>
        <div class="group selectable" id="g-iso">
            <span class="label" id="l-iso"></span><span class="value" id="v-iso"></span>
            <select id="s-iso" aria-label="ISO"></select>
        </div>
        <div class="group selectable" id="g-wb">
            <span class="label" id="l-wb"></span><span class="value" id="v-wb"></span>
            <select id="s-wb" aria-label="White balance"></select>
        </div>
        <div class="group selectable" id="g-res">
            <span class="label" id="l-res"></span><span class="value" id="v-res"></span>
            <span class="badge hidden" id="v-hdr-badge"></span>
            <select id="s-res" aria-label="Resolution"></select>
        </div>
    </div>

    <div id="stage">
        <div class="rail" id="rail-left"></div>
        <div id="preview-wrap">
            <div id="preview-frame" title="Tap to toggle record">
                <img id="stream" src="{{ stream_url }}" alt="Camera preview">
                <img id="stream-cam1" class="hidden" alt="Camera 1 preview">
                <div id="no-cam-overlay" class="hidden">
                    <div class="line title">CAMERA NOT FOUND</div>
                    <div class="line hint">Check camera cable and cinemate settings</div>
                    <div class="line warn">BE SURE TO DISCONNECT POWER BEFORE CONNECTING/DISCONNECTING CAMERA SENSOR BOARD</div>
                </div>
            </div>
        </div>
        <div class="rail hidden" id="rail-right">
            <div id="rail-right-sections"></div>
            <div class="hidden" id="vu-meter"></div>
        </div>
    </div>

    <div id="bottom">
        <div id="bottom-row">
            <div class="group"><span class="label">MEDIA</span><span class="value" id="v-disk"></span></div>
            <div class="group"><span class="value" id="v-write"></span></div>
            <div class="group"><span class="label">BUF</span><span class="value" id="v-buffer"></span>
                <div id="buffer-meter"><div id="buffer-fill"></div></div>
            </div>
            <div class="group"><span class="value" id="v-rectime"></span></div>
            <div class="group clip">
                <div class="clip-lines">
                    <span class="value hidden" id="v-clip-cam1"></span>
                    <span class="value" id="v-clip"></span>
                </div>
                <span class="badge wav hidden" id="v-wav">WAV</span>
            </div>
            <span class="warn lock hidden" id="v-lock">LOCK</span>
            <span class="warn voltage hidden" id="v-voltage">VOLTAGE</span>

            <div class="spacer"></div>

            <div class="group"><span class="label">CPU</span><span class="value" id="v-cpu"></span></div>
            <div class="group"><span class="label">TEMP</span><span class="value" id="v-temp"></span></div>
            <div class="group"><span class="label">RAM</span><span class="value" id="v-ram"></span></div>
            <div class="group hidden" id="g-battery"><span class="label">BATT</span><span class="value" id="v-battery"></span></div>
        </div>

        <div id="button-row">
            <!-- An <a>, not a button with a JS navigation, so long-press and
                 open-in-new-tab behave the way they should on a phone. -->
            <a id="btn-settings" class="btn-link" href="/settings-editor/" title="Settings, storage and playback" aria-label="Open the settings editor">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.13.35.4.63.74.79H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </a>
            <button id="btn-experiment" title="Show every remaining CLI control as a live widget">EXPERIMENT</button>
            <button id="btn-log" title="set log — toggles CineMate Log, restarts the camera when idle">LOG</button>
            <button id="btn-unmount" title="unmount">UNMOUNT</button>
            <button id="btn-fullscreen">FULLSCREEN</button>
        </div>

        <!-- Built from the spec tables in the script below, not written out
             here, so adding a control is one row rather than markup plus a
             binding plus a render line. -->
        <div id="experiment" class="hidden"></div>
    </div>
</div>

<div id="toast"></div>

<script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
<script>
(function () {
    'use strict';

    // ── control: every action is a CLI command line posted to the web API
    //    (docs/web-api.md). Same dispatcher as the CLI, serial and GPIO
    //    paths, so the browser cannot drift from them.
    const API = '/api/v1/cmd';
    const TOKEN = {{ api_token | tojson }};
    const CAM1_STREAM = {{ stream_url_cam1 | tojson }};

    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    async function cmd(line) {
        const headers = { 'Content-Type': 'text/plain' };
        if (TOKEN) { headers['X-Cinemate-Token'] = TOKEN; }
        try {
            const res = await fetch(API, { method: 'POST', headers, body: line });
            const body = (await res.text()).trim();
            if (!res.ok) { toast(line + ' → ' + (body || res.status)); }
            // A 200 whose body is more than bare "ok" is the API telling us the
            // command ran but the value did not stick — most often a pot
            // writing the same parameter right behind us. Without this the
            // slider would just spring back with no explanation.
            else if (body.length > 2) { toast(line + ' → ' + body.slice(3)); }
            return res.ok;
        } catch (err) {
            toast(line + ' → ' + err.message);
            return false;
        }
    }

    // ── state: the populate_values() dict, arriving whole as
    //    `initial_values` and as deltas as `gui_data_change`.
    let V = {};
    let steps = {
        iso: [], shutter_a: [], fps: [], wb: [], resolutions: [],
        // EXPERIMENT drawer only. Unlike the lists above, these are not
        // recomputed from the live frame rate — they come straight from
        // settings.jsonc and arrive once, with the snapshot.
        anamorphic: [], ranges: {}, defaults: {},
    };

    const $ = (id) => document.getElementById(id);
    const text = (id, value) => {
        const el = $(id);
        const s = (value === undefined || value === null) ? '' : String(value);
        if (el.textContent !== s) { el.textContent = s; }
    };
    const show = (el, on) => el.classList.toggle('hidden', !on);
    const truthy = (v) => v === true || v === 1 || v === '1' ||
        (typeof v === 'string' && ['true', 'yes', 'on'].includes(v.trim().toLowerCase()));

    function fillSelect(sel, options, current) {
        // The disabled flags are part of the cache key: a free-stepping toggle
        // can leave the value list identical while changing which entries are
        // selectable, and without this the list would not repaint.
        const wanted = options.map((o) => String(o.value) + (o.disabled ? '!' : '')).join(' ');
        if (sel.dataset.filled !== wanted) {
            sel.innerHTML = '';
            options.forEach((o) => {
                const opt = document.createElement('option');
                opt.value = o.value;
                opt.textContent = o.text;
                if (o.disabled) { opt.disabled = true; }
                sel.appendChild(opt);
            });
            sel.dataset.filled = wanted;
        }
        if (current !== undefined && current !== null) { sel.value = String(current); }
    }

    // Free stepping replaces a preset table with a fine grid running between
    // the ends of the parameter's own steps array, in increments of its
    // free_increment — and the setter then accepts any value verbatim
    // instead of snapping to the table (cinepi_controller: "In sync mode, or
    // free-stepping, just accept it verbatim"; the fps setter clamps to
    // 1..fps_max the same way). So the interior entries stop being the legal
    // set and become an arbitrary sample of a continuum. Grey them, leaving
    // the two ends, so the picker reads as the range it actually is; the value
    // itself is dialled with the EXPERIMENT slider, a pot, an encoder or the
    // CLI, and the live value still shows even while greyed because a
    // disabled <option> can be selected programmatically.
    //
    // Only SHUTTER and FPS. NOT WB: set_wb picks the closest entry of wb_steps
    // unconditionally and every entry has a real cg_rb pair, so under WB free
    // stepping the interior IS the exact legal set. NOT ISO: set_iso clamps
    // and never snaps in any mode, so iso_free changes what is offered, not
    // what is accepted. Greying either would state something untrue.
    // `current` is threaded in because a free grid need not contain the live
    // value: toggle free stepping on while SHUTTER sits at a preset 172.8 and
    // the 1-degree grid has no such entry, so the <select> would fall back to
    // its first option and read 1 while the camera runs at 172.8. Any value is
    // legal in this mode, so the honest thing is to carry it.
    function freeStepBounds(list, isFree, current) {
        const opts = list.map((v, i) => ({
            value: v,
            text: v,
            disabled: Boolean(isFree) && list.length > 2 && i > 0 && i < list.length - 1,
        }));
        const live = parseFloat(current);
        if (isFree && isFinite(live) && !list.some((v) => Number(v) === live)) {
            const at = opts.findIndex((o) => Number(o.value) > live);
            opts.splice(at < 0 ? opts.length : at, 0,
                { value: live, text: live, disabled: false });
        }
        return opts;
    }

    // ── left / right rails: same sections, order and box contents as
    //    draw_left_sections() / draw_right_sections().
    function box(content, classes) {
        const el = document.createElement('div');
        el.className = 'box' + (classes ? ' ' + classes : '');
        el.textContent = content;
        return el;
    }

    // _format_sensor_name() returns "585" or "585\nMONO"; simple_gui draws
    // one box per line, with MONO a size down so it fits.
    function boxes(value, classes) {
        if (value === undefined || value === null || value === '') { return []; }
        return String(value).split('\n').filter(Boolean).map((part) => {
            const extra = (part === 'MONO' || part.length > 3) ? ' small' : '';
            return box(part, (classes || '') + extra);
        });
    }

    function section(label, boxes) {
        if (!boxes.length) { return null; }
        const wrap = document.createElement('div');
        wrap.className = 'section';
        const lbl = document.createElement('div');
        lbl.className = 'section-label';
        lbl.textContent = label;
        const holder = document.createElement('div');
        holder.className = 'boxes';
        boxes.forEach((b) => holder.appendChild(b));
        wrap.appendChild(lbl);
        wrap.appendChild(holder);
        return wrap;
    }

    function warningBoxes() {
        // F-211: the framebuffer GUI's DROP/SYNC boxes are a fixed on-camera
        // size and only ever show the word, never a count -- there is no
        // room. The browser has room. drop_frame_count is already published
        // (populate_values(), aliases tc_hole_count) and unused here; show
        // it. frames_off_sync has no equivalent published count today -- the
        // frame-difference number that latches it (redis_listener.py) is
        // only logged, never set_value()'d -- so SYNC stays word-only rather
        // than this display change quietly growing into new live-path
        // telemetry with no Pi available to verify it.
        // No NO CAM badge here: the CAMERA NOT FOUND overlay already fills
        // the preview area, and V.sensor is empty so the CAM box isn't
        // rendered either. Same presentation choice as the framebuffer GUI
        // (see populate_values()) -- these two surfaces share state, so
        // letting the badge live on in one of them is exactly the kind of
        // drift that starts here.
        const out = [];
        if (V.drop_frame_latched) {
            const count = Number(V.drop_frame_count) || 0;
            const label = count > 0 ? `DROP ${count}` : 'DROP';
            out.push(box(label, 'drop' + ' small' + (count > 0 ? ' wide' : '')));
        }
        if (V.frames_off_sync) { out.push(box('SYNC', 'sync')); }
        return out;
    }

    function renderLeftRail() {
        const rail = $('rail-left');
        const sections = [];

        const cam = boxes(String(V.sensor || '').toUpperCase());
        if (V.aspect) { cam.push(box(V.aspect, 'outlined')); }
        if (V.log_badge_cam0) { cam.push(box(V.log_badge_cam0, 'log small')); }
        warningBoxes().forEach((b) => cam.push(b));
        sections.push(section('CAM', cam));

        const mon = [];
        if (V.zoom_factor) {
            mon.push(box(V.zoom_factor, V.zoom_is_default ? '' : 'zoom-active'));
        }
        if (V.anamorphic_factor) { mon.push(box(V.anamorphic_factor, 'outlined small')); }
        sections.push(section('MON', mon));

        if (V.mic_connected) {
            const aud = [];
            if (V.mic_sample_rate) { aud.push(box(V.mic_sample_rate, '')); }
            if (V.mic_bit_depth) { aud.push(box(V.mic_bit_depth, '')); }
            sections.push(section('AUD', aud));
        }

        const sys = [];
        if (V.usb_connected) { sys.push(box('SER', '')); }
        if (V.mic_connected) { sys.push(box('MIC', '')); }
        if (V.keyboard_connected) { sys.push(box('KEY', '')); }
        const storage = String(V.storage_type || '').toUpperCase();
        if (storage && storage !== 'NONE') {
            boxes(storage).forEach((b) => sys.push(b));
            const fs = String(V.storage_filesystem || '').toLowerCase();
            if (fs && !['none', 'unknown', ''].includes(fs)) {
                sys.push(box({ exfat: 'exFAT', ntfs: 'NTFS' }[fs] || fs, 'small'));
            }
        }
        sections.push(section('SYS', sys));

        rail.replaceChildren(...sections.filter(Boolean));
    }

    function renderRightRail() {
        const sections = $('rail-right-sections');

    // ── mic input VU meter (draw_right_vu_meter) ────────────────────────
    // Bar skeleton is rebuilt only when the channel count changes; every
    // other tick just updates height/colour/peak in place so the CSS
    // transition actually animates. Matches simple_gui's own thresholds
    // (<60 green, <85 yellow, else red) and its "L"/"R" vs. numeric
    // channel labels.
    function vuColor(level) {
        if (level < 60) return 'rgb(0, 255, 0)';
        if (level < 85) return 'rgb(255, 255, 0)';
        return 'rgb(255, 0, 0)';
    }

    let vuChannelCount = -1;

    function buildVuChannel(label) {
        const ch = document.createElement('div');
        ch.className = 'vu-channel';
        const track = document.createElement('div');
        track.className = 'vu-track';
        const fill = document.createElement('div');
        fill.className = 'vu-fill';
        const peak = document.createElement('div');
        peak.className = 'vu-peak';
        track.appendChild(fill);
        track.appendChild(peak);
        const lbl = document.createElement('span');
        lbl.className = 'label';
        lbl.textContent = label;
        ch.appendChild(track);
        ch.appendChild(lbl);
        return ch;
    }

    function renderVuMeter() {
        const container = $('vu-meter');
        const levels = Array.isArray(V.vu_levels) ? V.vu_levels : [];

        if (!levels.length) {
            show(container, false);
            vuChannelCount = -1;
            return;
        }

        const peaks = Array.isArray(V.vu_peaks) && V.vu_peaks.length === levels.length
            ? V.vu_peaks : levels;

        if (levels.length !== vuChannelCount) {
            const labels = levels.length === 2 ? ['L', 'R'] : levels.map((_, i) => String(i + 1));
            container.replaceChildren(...labels.map(buildVuChannel));
            vuChannelCount = levels.length;
        }

        const channels = container.children;
        for (let i = 0; i < levels.length; i++) {
            const level = Math.max(0, Math.min(100, Number(levels[i]) || 0));
            const peak = Math.max(0, Math.min(100, Number(peaks[i]) || 0));
            const track = channels[i].querySelector('.vu-track');
            track.querySelector('.vu-fill').style.height = level + '%';
            track.querySelector('.vu-fill').style.background = vuColor(level);
            track.querySelector('.vu-peak').style.bottom = peak + '%';
        }

        show(container, true);
    }

    function updateRailRightVisibility() {
        const hasSections = $('rail-right-sections').children.length > 0;

    let previewAspect = 16 / 9;

    function sizePreview() {
        const wrap = $('preview-wrap');
        const frame = $('preview-frame');
        const avail = wrap.getBoundingClientRect();
        if (!avail.width || !avail.height) { return; }
        // Fit the ratio inside the available box, letterbox or pillarbox
        // whichever the box calls for — the same choice _build_args() and
        // DrmPreview::Show() make for the on-camera preview window.
        let w = avail.width;
        let h = w / previewAspect;
        if (h > avail.height) {
            h = avail.height;
            w = h * previewAspect;
        }
        frame.style.width = Math.floor(w) + 'px';
        frame.style.height = Math.floor(h) + 'px';
        // Published for the portrait rule below. simple_gui flanks the image
        // itself on its 1920x1080 canvas, so the rails are as tall as the
        // picture there; on a phone held upright the stage row is much taller
        // than a 16:9 picture, and rails stretched to the row tower over it.
        $('stage').style.setProperty('--preview-h', Math.floor(h) + 'px');
        scheduleFit();
    }

    // ── EXPERIMENT drawer ─────────────────────────────────────────────
    // Everything cli_commands.py dispatches that the instrument layout
    // above does not already expose, minus the destructive four the API
    // blocks by default anyway (erase / format / reboot / shutdown) and
    // the restarts. Each widget posts the same command line the CLI would,
    // so none of this is a second implementation of a control — it is the
    // same dispatcher, reached from a slider.
    //
    // `key` names a field in the populate_values() dict, which is what lets
    // a widget follow a change made from a pot, the quad rotary, serial or
    // the CLI instead of only reflecting what this browser last sent.
    // A slider is one of two shapes, and which one is not a style choice — it
    // follows from what the setter does with an arbitrary value:
    //
    //   CONTINUOUS (min/max/step)  — the setter clamps or accepts verbatim, so
    //     every knob position is reachable and the value comes back unchanged.
    //   STEP-LIST (steps: '<name>') — the setter SNAPS to the nearest entry of
    //     a table. The knob indexes that same table, so every position is a
    //     fixed point of the setter. Get this wrong and the value latch never
    //     matches: the knob freezes for the full grace period and then jumps,
    //     which is worse than an instant snap-back because the operator has
    //     already moved on.
    //
    // The step tables are the live ones, republished by populate_values()
    // whenever they change — including when a free-stepping toggle rebuilds
    // them — so a step-list slider re-grids itself instead of going stale.
    // Ordered exposure-first: the four an operator reaches for constantly,
    // then the ClearHDR knobs, then the monitor-only one. The ClearHDR group
    // is present only on a sensor that actually has ClearHDR modes — on an
    // imx477 or imx283 those four commands write redis keys nothing will ever
    // read, so offering them would be four controls that appear to do nothing.
    // Shared with the top row's lock guard (bindTopSelect, below) so the
    // wording exists in exactly one place.
    const LOCK_LABELS = {
        iso_lock: 'ISO is locked',
        shutter_a_nom_lock: 'Shutter angle is locked',
        fps_lock: 'Frame rate is locked',
    };

    const XP_SLIDER_GROUPS = [
        {
            title: 'EXPOSURE',
            sliders: [
                // set_iso() only clamps to [min, max] of the ISO table — it
                // never snaps — so this one is genuinely continuous. dp MUST
                // stay 0: the command is typed `int`, and "800.0" comes back
                // as a bad argument.
                // boundsFrom, not steps: set_iso() clamps to the ends of the
                // ISO table but does not snap to its entries, so the travel is
                // continuous between the table's first and last value. Reading
                // the ends off the live table means widening arrays.iso.steps
                // widens the slider instead of silently disagreeing with it.
                { label: 'ISO',         cmd: 'set iso',           key: 'iso',           min: 100, max: 3200, step: 1,
                  boundsFrom: 'iso', lockKey: 'iso_lock', lockLabel: LOCK_LABELS.iso_lock },
                // set_shutter_a_nom() snaps to the flicker-free angle table in
                // normal mode and accepts verbatim in free/sync mode. Indexing
                // the table is correct in BOTH: free stepping rebuilds it as a
                // fine continuous grid, which the setter then takes verbatim.
                { label: 'SHUTTER NOM', cmd: 'set shutter a nom', key: 'shutter_a_nom', steps: 'shutter_a', dp: 1,
                  lockKey: 'shutter_a_nom_lock', lockLabel: LOCK_LABELS.shutter_a_nom_lock },
                // set_fps() snaps into fps_steps_dynamic. Its setter can also

                { label: 'FPS',         cmd: 'set fps',           key: 'fps',           steps: 'fps',
                  lockKey: 'fps_lock', lockLabel: LOCK_LABELS.fps_lock,
                  busyKey: 'resolution_switching', throttle: 600 },

            visibleKey: 'hdr_capable',
            sliders: [
                { label: 'HDR LOW',   cmd: 'set hdr threshold low',  key: 'hdr_threshold_low',  min: 0, max: 4095, step: 1 },

    const XP_FREE = [

    const XP_ACTIONS = [
