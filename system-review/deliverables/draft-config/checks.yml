# DRAFT -- not applied. Target path: <repo root>/.github/workflows/checks.yml
#
# This file has NEVER been executed. No GitHub Actions run, no local `act`,
# no pytest invocation informed it. Treat it as a reviewed starting point,
# not as a working workflow. See ../STANDARDS-PROPOSAL.md §6 and §11.
#
# It deliberately does NOT touch docs.yml. That file has a publishing trap
# (it pushes to gh-pages and commits a PDF) and its fix is a separate edit,
# written out in docs-split.md.

name: checks

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

# Read-only. Nothing in this workflow publishes, pushes, or comments.
permissions:
  contents: read

jobs:

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # Raspberry Pi OS bookworm. docs.yml pins
                                   # 3.12 -- reconcile the two before adopting.
      - name: Install ruff
        run: python -m pip install ruff
      # Run this locally once and fix or ignore the hits BEFORE enabling the
      # job, so the first CI run on `dev` is green. A check that is red on
      # arrival gets ignored -- see STANDARDS-PROPOSAL.md §2.
      - name: ruff check
        run: ruff check src/

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Baseline at the time of writing (S06): 15 findings across 11 scripts,
      # of which cinemate-install.sh (1916 lines) contributes exactly one.
      # Fix those 15 first, then this gates at zero. See F-174 -- the shell in
      # this repo is materially cleaner than the Python.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

  drift:
    name: contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The Redis key contract spans two repositories, so the check needs both.
      - name: Check out cinepi-raw
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 \
            https://github.com/Tiramisioux/cinepi-raw ../cinepi-raw

      # NOTE ON LOCATION: redis_key_diff.py currently lives under
      # system-review/harness/, which is review scaffolding, not shipped code.
      # Adopting this job means giving it a permanent home -- `tools/` is the
      # obvious one. The path below assumes that move has happened.
      #
      # RATCHET, NOT GATE. There are 12 known unreferenced keys today. Wired
      # with --strict this fails on day one and gets disabled in week two.
      # The baseline number is committed and the check fails only on an
      # increase. Retire the 12 deliberately; the ratchet stops new ones.
      - name: Redis key contract (ratchet)
        run: python3 tools/redis_key_diff.py --max-unreferenced 12

      # NOT YET WRITTEN. Both are plain ast/json, no imports of the app, no
      # hardware. Specified in STANDARDS-PROPOSAL.md §3.2 and §3.3.
      #
      # - name: Settings defaults agree across the 4 registries (ratchet at 11)
      #   run: python3 tools/check_settings_defaults.py --max-disagreements 11
      #
      # - name: Reflectively-dispatched method names all resolve (gate at 0)
      #   run: python3 tools/check_dispatch_names.py

  test:
    name: pytest (discovery)
    runs-on: ubuntu-latest
    # ---------------------------------------------------------------------
    # STATED ASSUMPTION -- this job is written blind. See PI-002.
    #
    # There are 27 test files under _test/ and no runner has ever executed
    # them. Which of them need a Raspberry Pi (GPIO, I2C, a real sensor, a
    # running redis) and which are portable is UNKNOWN, and cannot be
    # determined by reading.
    #
    # So this job runs in DISCOVERY mode: continue-on-error is true and the
    # only purpose of the first few runs is to read the output and learn the
    # split. The very first task after adopting this file is to mark the
    # hardware tests (a `hardware` marker plus `-m "not hardware"` here) and
    # then DELETE continue-on-error.
    #
    # A workflow that asserts a green suite nobody has ever seen is worse
    # than no workflow.
    # ---------------------------------------------------------------------
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # redis is a hard dependency of large parts of src/; without it the
      # collection error tells us nothing about the tests themselves.
      - name: Start redis
        run: |
          sudo apt-get update -qq && sudo apt-get install -y redis-server
          sudo systemctl start redis-server

      # Deliberately NOT `pip install -r requirements.txt`. That file is
      # inert (F-003), lists a stdlib module (F-002), and does not match what
      # the installer builds. Install what the tests import, and let the
      # failures name anything missing.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest redis psutil pillow numpy termcolor \
            flask flask_socketio pyudev

      - name: pytest
        run: python -m pytest _test/ -v --tb=short
